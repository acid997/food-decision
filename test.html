<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E63946">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="美食决定器">
  <link rel="manifest" href="manifest.json">
  <title>今天翻谁的牌 · 美食决定器 (豪华版)</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
  <style>
    /* ==================== CSS 变量 & 主题 ==================== */
    :root {
      --bg-start: #ff6b6b;
      --bg-mid: #feca57;
      --bg-end: #ff9ff3;
      --card-bg: rgba(255, 243, 224, 0.85);
      --card-back-bg: rgba(255, 255, 255, 0.92);
      --text: #4A2E1B;
      --text-secondary: #8B7355;
      --accent: #E63946;
      --accent-glow: #ff4757;
      --accent2: #F4A261;
      --accent3: #e17055;
      --border: #4A2E1B;
      --btn-bg: rgba(255, 243, 224, 0.8);
      --item-bg: rgba(255, 255, 255, 0.85);
      --shadow: rgba(0,0,0,0.15);
      --list-bg: rgba(255, 243, 224, 0.75);
      --modal-bg: rgba(255, 243, 224, 0.97);
      --settings-bg: rgba(255, 243, 224, 0.97);
      --header-bg: #E63946;
      --header-text: #ffffff;
      --badge-bg: #F4A261;
      --overlay: rgba(0,0,0,0.45);
      --input-bg: #ffffff;
      --glass: rgba(255,255,255,0.25);
      --glass-border: rgba(255,255,255,0.4);
    }
    body.dark {
      --bg-start: #0c0c1d;
      --bg-mid: #1a1a3e;
      --bg-end: #0f3460;
      --card-bg: rgba(22, 33, 62, 0.88);
      --card-back-bg: rgba(15, 52, 96, 0.92);
      --text: #e8e8e8;
      --text-secondary: #aab;
      --accent: #ff6b6b;
      --accent-glow: #ff8e8e;
      --accent2: #f7a440;
      --accent3: #e17055;
      --border: #6c5ce7;
      --btn-bg: rgba(22, 33, 62, 0.8);
      --item-bg: rgba(22, 33, 62, 0.85);
      --shadow: rgba(0,0,0,0.4);
      --list-bg: rgba(22, 33, 62, 0.7);
      --modal-bg: rgba(26, 26, 46, 0.97);
      --settings-bg: rgba(26, 26, 46, 0.97);
      --header-bg: #b33040;
      --header-text: #ffffff;
      --badge-bg: #6c5ce7;
      --overlay: rgba(0,0,0,0.65);
      --input-bg: #0f3460;
      --glass: rgba(108,92,231,0.15);
      --glass-border: rgba(108,92,231,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
      background-size: 400% 400%;
      animation: bgShift 20s ease infinite;
      font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 16px;
      min-height: 100vh;
      color: var(--text);
      transition: background 0.5s, color 0.3s;
      overflow-x: hidden;
      position: relative;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
      100% { background-position: 0% 50%; }
    }

    /* 飘浮食物背景 */
    .floating-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .float-emoji {
      position: absolute; font-size: 28px; opacity: 0.15;
      animation: floatAround var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      filter: blur(0.5px);
    }
    @keyframes floatAround {
      0% { transform: translateY(0) translateX(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-30px) translateX(20px) rotate(90deg) scale(1.1); }
      50% { transform: translateY(-10px) translateX(-10px) rotate(180deg) scale(0.9); }
      75% { transform: translateY(-40px) translateX(-20px) rotate(270deg) scale(1.05); }
      100% { transform: translateY(0) translateX(0) rotate(360deg) scale(1); }
    }
    body.dark .float-emoji { opacity: 0.08; }

    /* 深色模式星星 */
    .stars-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; display: none;
    }
    body.dark .stars-container { display: block; }
    .star {
      position: absolute; background: white; border-radius: 50%;
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      opacity: 0;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.5); }
    }

    .app-container { max-width: 520px; margin: 0 auto; position: relative; z-index: 1; }

    /* Header - 玻璃拟态 */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(135deg, var(--header-bg), var(--accent3));
      padding: 14px 22px; border-radius: 40px; margin-bottom: 16px;
      box-shadow: 0 8px 20px var(--shadow), 0 0 40px rgba(230,57,70,0.2);
      backdrop-filter: blur(10px);
    }
    .header h1 {
      font-family: 'Bangers', 'Arial Black', cursive; font-size: 1.5rem;
      color: var(--header-text); text-shadow: 2px 2px 0 rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.3);
      letter-spacing: 1.5px;
    }
    .header-actions { display: flex; gap: 4px; }
    .header-btn {
      background: none; border: none; font-size: 22px; cursor: pointer;
      color: var(--header-text); text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
      transition: transform 0.2s, filter 0.2s; padding: 4px;
    }
    .header-btn:hover { transform: scale(1.2); filter: drop-shadow(0 0 6px white); }

    /* Mode bar */
    .mode-scroll { overflow-x: auto; white-space: nowrap; padding-bottom: 6px; scrollbar-width: none; }
    .mode-scroll::-webkit-scrollbar { display: none; }
    .mode-buttons { display: inline-flex; gap: 10px; }
    .mode-btn {
      background: var(--glass); border: 2px solid var(--glass-border); border-radius: 40px;
      padding: 8px 16px; font-size: 0.88rem; font-weight: bold; color: var(--text);
      cursor: pointer; transition: 0.2s; white-space: nowrap;
      backdrop-filter: blur(8px); box-shadow: 0 4px 12px var(--shadow);
    }
    .mode-btn.active {
      background: var(--accent2); color: white; border-color: var(--accent);
      transform: translateY(-2px); box-shadow: 0 6px 20px rgba(244,162,97,0.5);
    }
    .mode-desc {
      text-align: center; margin: 10px 0 6px; font-size: 0.8rem;
      background: var(--glass); backdrop-filter: blur(8px);
      display: inline-block; padding: 5px 16px; border-radius: 60px;
      border: 1px solid var(--glass-border);
    }

    /* Category bar */
    .category-bar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center;
    }
    .category-btn {
      background: var(--glass); border: 2px solid var(--glass-border); border-radius: 40px;
      padding: 5px 14px; font-size: 0.78rem; font-weight: bold; color: var(--text);
      cursor: pointer; transition: 0.2s; backdrop-filter: blur(6px);
      box-shadow: 0 3px 10px var(--shadow);
    }
    .category-btn.active {
      background: var(--accent); color: white; border-color: var(--accent);
      transform: translateY(-1px); box-shadow: 0 4px 16px rgba(230,57,70,0.4);
    }

    /* Card - 核心 */
    .decision-card {
      background: transparent; perspective: 1200px; margin: 16px 0; cursor: pointer; height: 270px;
    }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d; border-radius: 28px;
      box-shadow: 0 16px 40px var(--shadow), 0 0 60px rgba(230,57,70,0.15);
    }
    .card-front, .card-back {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      border-radius: 28px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; overflow: hidden;
    }
    .card-front {
      background: linear-gradient(145deg, rgba(255,243,224,0.9), rgba(255,255,255,0.85));
      transform: rotateY(0deg);
      border: 3px solid rgba(255,255,255,0.5);
      backdrop-filter: blur(10px);
    }
    body.dark .card-front {
      background: linear-gradient(145deg, rgba(22,33,62,0.9), rgba(26,26,62,0.85));
      border-color: rgba(108,92,231,0.3);
    }
    .card-front::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(244,162,97,0.15), transparent, rgba(230,57,70,0.1), transparent);
      animation: rotateGlow 8s linear infinite;
    }
    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .card-front-content {
      position: relative; z-index: 1; text-align: center;
    }
    .wheel-icon {
      font-size: 80px; display: block;
      animation: wheelPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 8px 20px rgba(230,57,70,0.3));
    }
    @keyframes wheelPulse {
      0%,100% { transform: scale(1) rotate(0deg); }
      15% { transform: scale(1.08) rotate(5deg); }
      30% { transform: scale(1) rotate(0deg); }
      45% { transform: scale(1.05) rotate(-3deg); }
      60% { transform: scale(1) rotate(0deg); }
    }
    .card-hint {
      color: var(--text-secondary); font-size: 0.9rem; margin-top: 10px;
      font-weight: 600; letter-spacing: 0.5px;
    }
    .card-subhint {
      color: var(--text-secondary); font-size: 0.7rem; opacity: 0.7; margin-top: 4px;
    }

    /* 卡片背面 */
    .card-back {
      background: linear-gradient(160deg, var(--card-back-bg), var(--card-bg));
      transform: rotateY(180deg); gap: 8px;
      border: 3px solid var(--accent2);
      box-shadow: inset 0 0 60px rgba(244,162,97,0.08);
      padding: 16px;
    }
    body.dark .card-back {
      border-color: var(--border);
      box-shadow: inset 0 0 60px rgba(108,92,231,0.1);
    }
    .card-back::after {
      content: ''; position: absolute; top: 10px; right: 10px; bottom: 10px; left: 10px;
      border: 1px dashed var(--accent2); border-radius: 20px; opacity: 0.4; pointer-events: none;
    }
    .flipped { transform: rotateY(180deg); }

    .food-category {
      font-size: 0.75rem; font-weight: bold; padding: 3px 12px; border-radius: 20px;
      letter-spacing: 0.5px; z-index: 1; position: relative;
    }
    .cat-中餐 { background: #ff6b6b; color: white; }
    .cat-日料 { background: #feca57; color: #4A2E1B; }
    .cat-西餐 { background: #48dbfb; color: #1a3a5c; }
    .cat-快餐 { background: #ff9f43; color: white; }
    .cat-甜点 { background: #f368e0; color: white; }
    .cat-小吃 { background: #a29bfe; color: white; }
    .cat-其他 { background: #636e72; color: white; }

    .food-name {
      font-size: 30px; font-weight: 800; color: var(--accent);
      text-align: center; padding: 0 12px; z-index: 1; position: relative;
      text-shadow: 0 2px 10px var(--accent-glow);
      line-height: 1.2;
    }
    .food-fav { font-size: 20px; z-index: 1; position: relative; }
    .food-date {
      font-size: 12px; color: var(--text-secondary);
      background: var(--glass); padding: 3px 12px; border-radius: 40px;
      z-index: 1; position: relative;
    }
    .food-eat-count { font-size: 11px; color: var(--accent2); font-weight: bold; z-index: 1; position: relative; }
    .mode-hint { font-size: 11px; color: var(--accent2); font-weight: bold; z-index: 1; position: relative; }

    /* 换一个按钮 */
    .reroll-btn {
      margin-top: 4px; padding: 6px 20px; border-radius: 40px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none; color: white; font-size: 0.85rem; font-weight: bold;
      cursor: pointer; transition: 0.2s; z-index: 2; position: relative;
      box-shadow: 0 4px 12px rgba(230,57,70,0.3);
      letter-spacing: 0.5px;
    }
    .reroll-btn:hover { transform: scale(1.05); }
    .reroll-btn:active { transform: scale(0.95); }

    /* Ate button */
    .ate-btn {
      width: 80%; margin: 0 auto 16px; display: block;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      border: 3px solid var(--border); border-radius: 60px;
      padding: 12px; font-size: 1.3rem; font-weight: bold; color: white;
      cursor: pointer; transition: 0.2s;
      box-shadow: 0 6px 0 var(--border), 0 8px 20px var(--shadow);
      text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
    }
    .ate-btn.disabled { opacity: 0.5; pointer-events: none; transform: none; }
    .ate-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--border), 0 4px 10px var(--shadow); }

    /* Search */
    .search-bar {
      display: flex; gap: 8px; margin: 10px 0; align-items: center;
    }
    .search-input {
      flex: 1; padding: 10px 16px; border: 2px solid var(--glass-border); border-radius: 40px;
      font-size: 0.9rem; background: var(--glass); color: var(--text);
      outline: none; backdrop-filter: blur(8px); transition: 0.2s;
    }
    .search-input:focus { border-color: var(--accent2); box-shadow: 0 0 16px rgba(244,162,97,0.2); }
    .search-input::placeholder { color: var(--text-secondary); opacity: 0.7; }
    .filter-select {
      padding: 10px 12px; border: 2px solid var(--glass-border); border-radius: 40px;
      font-size: 0.85rem; background: var(--glass); color: var(--text);
      cursor: pointer; backdrop-filter: blur(8px);
    }

    /* Food list */
    .food-list-header {
      display: flex; justify-content: space-between; align-items: center;
      margin: 16px 0 8px; background: var(--glass); backdrop-filter: blur(10px);
      padding: 8px 16px; border-radius: 40px; border: 1px solid var(--glass-border);
    }
    .food-list-header h3 { font-size: 1rem; }
    .list-actions button {
      background: none; border: none; font-size: 20px; cursor: pointer; margin-left: 10px; transition: 0.15s;
    }
    .list-actions button:hover { transform: scale(1.2); }
    .food-list {
      background: var(--list-bg); backdrop-filter: blur(10px);
      border-radius: 24px; padding: 6px; max-height: 350px; overflow-y: auto;
      border: 1px solid var(--glass-border);
    }
    .food-item {
      background: var(--item-bg); border: 2px solid var(--glass-border); border-radius: 50px;
      margin: 6px 0; padding: 8px 16px; display: flex; align-items: center;
      justify-content: space-between; transition: 0.2s; backdrop-filter: blur(4px);
    }
    .food-item:hover { transform: translateX(4px); box-shadow: 0 4px 12px var(--shadow); }
    .food-info { flex: 1; display: flex; flex-direction: column; }
    .food-name-row { display: flex; align-items: center; gap: 8px; }
    .food-name-text { font-weight: bold; font-size: 1rem; }
    .food-cat-tag {
      font-size: 0.62rem; padding: 2px 8px; border-radius: 20px; font-weight: bold;
      letter-spacing: 0.3px;
    }
    .food-date-text { font-size: 0.7rem; color: var(--text-secondary); }
    .food-stats { font-size: 0.7rem; color: var(--accent2); }
    .food-actions button {
      background: none; border: none; font-size: 17px; margin: 0 2px; cursor: pointer; transition: 0.15s;
    }
    .food-actions button:hover { transform: scale(1.25); }
    .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
    .empty-state .big-icon { font-size: 48px; display: block; margin-bottom: 8px; }

    /* FAB */
    .fab {
      position: fixed; bottom: 30px; right: 20px; width: 56px; height: 56px;
      border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent3));
      border: 3px solid rgba(255,255,255,0.4); color: white; font-size: 30px;
      font-weight: bold; box-shadow: 0 8px 24px rgba(230,57,70,0.4);
      cursor: pointer; transition: 0.2s; z-index: 100;
    }
    .fab:hover { transform: scale(1.08); }
    .fab:active { transform: scale(0.9); }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--overlay); align-items: center; justify-content: center; z-index: 1000;
    }
    .modal.open { display: flex; }
    .modal-content {
      background: var(--modal-bg); border: 3px solid var(--glass-border); border-radius: 32px;
      padding: 24px; width: 90%; max-width: 340px; text-align: center;
      backdrop-filter: blur(20px); box-shadow: 0 20px 60px var(--shadow);
    }
    .modal-content h3 { margin-bottom: 12px; color: var(--accent); }
    .modal-content input, .modal-content select {
      width: 100%; padding: 12px; margin: 8px 0; border: 2px solid var(--glass-border);
      border-radius: 40px; font-size: 0.95rem; background: var(--input-bg); color: var(--text);
    }
    .modal-content select { appearance: auto; cursor: pointer; }
    .char-counter { font-size: 0.75rem; color: var(--text-secondary); text-align: right; }
    .modal-buttons { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    .modal-buttons button {
      padding: 8px 20px; border-radius: 40px; border: 2px solid var(--glass-border);
      background: var(--glass); color: var(--text); cursor: pointer; font-weight: bold; transition: 0.15s;
    }
    .modal-buttons button:hover { transform: translateY(-1px); }
    .modal-confirm { background: var(--accent) !important; color: white !important; border-color: var(--accent) !important; }
    .delete-btn { background: var(--border) !important; color: white !important; }

    /* Stats panel */
    .stats-panel {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--overlay); align-items: center; justify-content: center; z-index: 1000;
    }
    .stats-panel.open { display: flex; }
    .stats-content {
      background: var(--modal-bg); border: 3px solid var(--glass-border); border-radius: 32px;
      padding: 20px; width: 90%; max-width: 380px; max-height: 80vh; overflow-y: auto;
      backdrop-filter: blur(20px);
    }
    .stats-content h3 { text-align: center; color: var(--accent); margin-bottom: 16px; }
    .stat-row {
      display: flex; justify-content: space-between; padding: 8px 0;
      border-bottom: 1px dashed var(--glass-border);
    }
    .stat-bar {
      height: 8px; background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 4px; margin: 4px 0; transition: width 0.6s;
    }
    .rank-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .rank-num { font-size: 1.4rem; font-weight: bold; color: var(--accent); min-width: 30px; }
    .rank-name { flex: 1; font-weight: bold; }
    .rank-count { color: var(--text-secondary); font-size: 0.85rem; }
    .week-calendar { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; justify-content: center; }
    .day-dot {
      width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 0.7rem; font-weight: bold; cursor: pointer;
      border: 2px solid var(--glass-border); transition: 0.2s;
    }
    .day-dot.eaten { background: var(--accent); color: white; box-shadow: 0 0 12px rgba(230,57,70,0.4); }
    .day-dot.not-eaten { background: var(--glass); color: var(--text-secondary); }

    /* Settings panel */
    .settings-panel {
      position: fixed; bottom: -100%; left: 0; width: 100%;
      background: var(--settings-bg); border-top: 4px solid var(--accent);
      border-radius: 40px 40px 0 0; transition: bottom 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      padding: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 12px;
      max-height: 75vh; overflow-y: auto; backdrop-filter: blur(20px);
    }
    .settings-panel.open { bottom: 0; }
    .settings-header { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
    .settings-row { display: flex; justify-content: space-between; align-items: center; }
    .settings-row label { font-size: 0.95rem; cursor: pointer; }
    .settings-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .settings-btn {
      flex: 1; min-width: 100px; padding: 10px; border-radius: 40px;
      border: 2px solid var(--glass-border); background: var(--glass); color: var(--text);
      cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.15s;
    }
    .settings-btn:hover { transform: translateY(-1px); }
    .danger-btn { background: var(--border) !important; color: white !important; }
    .info-btn { background: var(--accent) !important; color: white !important; }

    /* Toggle */
    .toggle {
      position: relative; width: 52px; height: 28px; display: inline-block;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: #ccc; border-radius: 28px; transition: 0.3s;
    }
    .toggle-slider:before {
      content: ""; position: absolute; height: 22px; width: 22px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%; transition: 0.3s;
    }
    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider:before { transform: translateX(24px); }

    .storage-info {
      font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; text-align: center;
      word-break: break-all; line-height: 1.6;
    }

    /* Slot machine */
    .slot-container {
      position: absolute; width: 100%; height: 100%; top: 0; left: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--card-bg); border-radius: 24px; z-index: 10;
      overflow: hidden; border: 3px solid var(--accent2); backdrop-filter: blur(10px);
    }
    .slot-item {
      font-size: 38px; font-weight: 800; color: var(--accent);
      animation: slotScroll 0.07s linear infinite; padding: 0 20px;
    }
    @keyframes slotScroll {
      0% { transform: translateY(-80px); opacity: 0; }
      40% { opacity: 1; }
      60% { opacity: 1; }
      100% { transform: translateY(80px); opacity: 0; }
    }
    .slot-hidden { display: none; }

    /* Particles */
    .particle {
      position: fixed; pointer-events: none; font-size: 30px; z-index: 9999;
      animation: particleFly 1.1s ease-out forwards;
    }
    @keyframes particleFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2) rotate(var(--rot)); }
    }

    /* Responsive */
    @media (max-width: 400px) {
      .header h1 { font-size: 1.2rem; }
      .mode-btn { padding: 6px 12px; font-size: 0.78rem; }
      .food-name { font-size: 24px; }
      .wheel-icon { font-size: 60px; }
      .decision-card { height: 240px; }
    }
  </style>
</head>
<body>

<script>
(function(){
  // ==================== DOM ====================
  const modeBtns = document.querySelectorAll('.mode-btn');
  const modeDesc = document.getElementById('modeDesc');
  const decisionCard = document.getElementById('decisionCard');
  const ateBtn = document.getElementById('ateBtn');
  const rerollBtn = document.getElementById('rerollBtn');
  const foodListDiv = document.getElementById('foodList');
  const foodCountSpan = document.getElementById('foodCount');
  const fab = document.getElementById('fab');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const foodNameInput = document.getElementById('foodNameInput');
  const charCountSpan = document.getElementById('charCount');
  const categorySelect = document.getElementById('categorySelect');
  const modalConfirm = document.getElementById('modalConfirm');
  const modalCancelBtn = document.getElementById('modalCancel');
  const deleteModal = document.getElementById('deleteModal');
  const deleteFoodNameSpan = document.getElementById('deleteFoodName');
  const deleteConfirm = document.getElementById('deleteConfirm');
  const deleteCancelBtn = document.getElementById('deleteCancel');
  const importModal = document.getElementById('importModal');
  const importMerge = document.getElementById('importMerge');
  const importOverwrite = document.getElementById('importOverwrite');
  const importCancelBtn = document.getElementById('importCancel');
  const templateModal = document.getElementById('templateModal');
  const templateCancel = document.getElementById('templateCancel');
  const settingsPanel = document.getElementById('settingsPanel');
  const settingsBtn = document.getElementById('settingsBtn');
  const soundToggle = document.getElementById('soundToggle');
  const vibrateToggle = document.getElementById('vibrateToggle');
  const slotToggle = document.getElementById('slotToggle');
  const particleToggle = document.getElementById('particleToggle');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');
  const clearAllFoodsBtn = document.getElementById('clearAllFoodsBtn');
  const closeSettingsBtn = document.getElementById('closeSettings');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const templateBtn = document.getElementById('templateBtn');
  const darkModeBtn = document.getElementById('darkModeBtn');
  const statsBtn = document.getElementById('statsBtn');
  const statsPanel = document.getElementById('statsPanel');
  const closeStatsBtn = document.getElementById('closeStats');
  const searchInput = document.getElementById('searchInput');
  const filterSelect = document.getElementById('filterSelect');
  const categoryBtns = document.querySelectorAll('.category-btn');
  const showStorageBtn = document.getElementById('showStorageBtn');
  const storageInfoDiv = document.getElementById('storageInfo');

  // ==================== 数据 ====================
  let foods = [];
  let eatHistory = [];
  let soundEnabled = false;
  let vibrateEnabled = true;
  let slotEnabled = true;
  let particleEnabled = true;
  let currentMode = 'fair';
  let currentFood = null;
  let currentCategory = 'all';
  let editTargetId = null;
  let darkMode = false;
  let isSpinning = false;

  // ==================== 预设模板 ====================
  const templates = {
    chinese: [
      {name:"宫保鸡丁",category:"中餐"},{name:"麻婆豆腐",category:"中餐"},{name:"红烧肉",category:"中餐"},
      {name:"糖醋里脊",category:"中餐"},{name:"水煮鱼",category:"中餐"},{name:"回锅肉",category:"中餐"},
      {name:"鱼香肉丝",category:"中餐"},{name:"西红柿炒蛋",category:"中餐"},{name:"酸菜鱼",category:"中餐"},
      {name:"辣子鸡",category:"中餐"},{name:"炒饭",category:"中餐"},{name:"饺子",category:"中餐"}
    ],
    japanese: [
      {name:"寿司",category:"日料"},{name:"拉面",category:"日料"},{name:"天妇罗",category:"日料"},
      {name:"鳗鱼饭",category:"日料"},{name:"章鱼烧",category:"日料"},{name:"味增汤",category:"日料"},
      {name:"咖喱饭",category:"日料"},{name:"炸猪排",category:"日料"}
    ],
    fastfood: [
      {name:"汉堡",category:"快餐"},{name:"炸鸡",category:"快餐"},{name:"披萨",category:"快餐"},
      {name:"薯条",category:"快餐"},{name:"热狗",category:"快餐"},{name:"三明治",category:"快餐"},
      {name:"炸鸡翅",category:"快餐"},{name:"鸡肉卷",category:"快餐"},{name:"意面",category:"快餐"},
      {name:"沙拉",category:"快餐"}
    ],
    snack: [
      {name:"麻辣烫",category:"小吃"},{name:"烤串",category:"小吃"},{name:"煎饼果子",category:"小吃"},
      {name:"肉夹馍",category:"小吃"},{name:"凉皮",category:"小吃"},{name:"臭豆腐",category:"小吃"},
      {name:"生煎包",category:"小吃"},{name:"小龙虾",category:"小吃"},{name:"烤冷面",category:"小吃"},
      {name:"螺蛳粉",category:"小吃"}
    ],
    mix: [
      {name:"火锅",category:"中餐"},{name:"烧烤",category:"中餐"},{name:"寿司",category:"日料"},
      {name:"披萨",category:"西餐"},{name:"汉堡",category:"快餐"},{name:"麻辣烫",category:"小吃"},
      {name:"蛋糕",category:"甜点"},{name:"冰淇淋",category:"甜点"},{name:"拉面",category:"日料"},
      {name:"炸鸡",category:"快餐"},{name:"饺子",category:"中餐"},{name:"牛排",category:"西餐"},
      {name:"烤鱼",category:"中餐"},{name:"肉夹馍",category:"小吃"},{name:"意面",category:"西餐"},
      {name:"奶茶",category:"甜点"},{name:"烤串",category:"小吃"},{name:"酸菜鱼",category:"中餐"},
      {name:"沙拉",category:"西餐"},{name:"煎饼果子",category:"小吃"}
    ]
  };

  // ==================== 飘浮背景 ====================
  function initFloatingBg() {
    const container = document.getElementById('floatingBg');
    const emojis = ['🍕','🍔','🍟','🌮','🍣','🍜','🍩','🍰','🧁','🥟','🍗','🥗','🍝','🍱','🍦','🍪'];
    for (let i = 0; i < 16; i++) {
      const el = document.createElement('span');
      el.className = 'float-emoji';
      el.textContent = emojis[i % emojis.length];
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 100 + '%';
      el.style.setProperty('--dur', (8 + Math.random() * 12) + 's');
      el.style.setProperty('--delay', Math.random() * 8 + 's');
      el.style.fontSize = (20 + Math.random() * 30) + 'px';
      container.appendChild(el);
    }
  }

  // ==================== 星空 ====================
  function initStars() {
    const container = document.getElementById('starsContainer');
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.width = (1 + Math.random() * 3) + 'px';
      star.style.height = star.style.width;
      star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
      star.style.setProperty('--delay', Math.random() * 4 + 's');
      container.appendChild(star);
    }
  }

  // ==================== 音效 ====================
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
  }
  function playTone(freq, duration, type='sine', vol=0.3) {
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  }
  function playSound(type) {
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (type === 'click') playTone(800, 0.1, 'square', 0.15);
    else if (type === 'add') { playTone(600, 0.12, 'sine', 0.2); setTimeout(()=>playTone(900, 0.12, 'sine', 0.2), 100); }
    else if (type === 'delete') playTone(200, 0.2, 'triangle', 0.2);
    else if (type === 'spin') {
      for (let i=0; i<8; i++) {
        setTimeout(()=>playTone(300+Math.random()*600, 0.06, 'square', 0.08), i*50);
      }
    }
    else if (type === 'win') {
      playTone(523, 0.15, 'sine', 0.3);
      setTimeout(()=>playTone(659, 0.15, 'sine', 0.3), 150);
      setTimeout(()=>playTone(784, 0.25, 'sine', 0.3), 300);
    }
    else if (type === 'chew') playTone(150, 0.15, 'triangle', 0.2);
    else if (type === 'mode') playTone(500, 0.08, 'sine', 0.1);
  }

  function enableSound() {
    if (soundEnabled) return;
    soundEnabled = true;
    localStorage.setItem('food_soundEnabled', 'true');
    if (soundToggle) soundToggle.checked = true;
    playSound('click');
  }

  // ==================== 震动 ====================
  function vibrate(ms=100) {
    if (vibrateEnabled && navigator.vibrate) navigator.vibrate(ms);
  }

  // ==================== 粒子特效 ====================
  function spawnParticles(x, y) {
    if (!particleEnabled) return;
    const emojis = ['🎉','✨','🌟','💫','🎊','🎈','🔥','❤️','🍕','🍔','🍣','🎯'];
    for (let i=0; i<14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.innerText = emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.setProperty('--dx', (Math.random()-0.5)*250 + 'px');
      p.style.setProperty('--dy', (Math.random()*-250 - 60) + 'px');
      p.style.setProperty('--rot', (Math.random()-0.5)*900 + 'deg');
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 1100);
    }
  }

  // ==================== 存储 ====================
  function saveAll() {
    localStorage.setItem('food_app_foods', JSON.stringify(foods));
    localStorage.setItem('food_app_eatHistory', JSON.stringify(eatHistory));
  }
  function loadAll() {
    const fs = localStorage.getItem('food_app_foods');
    foods = fs ? JSON.parse(fs) : [];
    const eh = localStorage.getItem('food_app_eatHistory');
    eatHistory = eh ? JSON.parse(eh) : [];
    const se = localStorage.getItem('food_soundEnabled');
    soundEnabled = (se === 'true');
    if (soundToggle) soundToggle.checked = soundEnabled;
    const ve = localStorage.getItem('food_vibrateEnabled');
    if (ve !== null) { vibrateEnabled = (ve === 'true'); if (vibrateToggle) vibrateToggle.checked = vibrateEnabled; }
    const sle = localStorage.getItem('food_slotEnabled');
    if (sle !== null) { slotEnabled = (sle === 'true'); if (slotToggle) slotToggle.checked = slotEnabled; }
    const pe = localStorage.getItem('food_particleEnabled');
    if (pe !== null) { particleEnabled = (pe === 'true'); if (particleToggle) particleToggle.checked = particleEnabled; }
    const dm = localStorage.getItem('food_darkMode');
    darkMode = (dm === 'true');
    if (darkMode) { document.body.classList.add('dark'); darkModeBtn.innerText = '☀️'; }
  }

  function getEatCount(foodId) {
    return eatHistory.filter(h => h.foodId === foodId).length;
  }

  function getRecentEatenIds(limit=3) {
    const sorted = [...eatHistory].sort((a,b)=>new Date(b.date)-new Date(a.date));
    return [...new Set(sorted.map(h=>h.foodId))].slice(0, limit);
  }

  // ==================== UI 渲染 ====================
  function renderFoodList() {
    let displayFoods = [...foods];
    if (currentCategory !== 'all') {
      displayFoods = displayFoods.filter(f => f.category === currentCategory);
    }
    const query = searchInput.value.trim().toLowerCase();
    if (query) {
      displayFoods = displayFoods.filter(f => f.name.toLowerCase().includes(query));
    }
    const filter = filterSelect.value;
    if (filter === 'fav') {
      displayFoods = displayFoods.filter(f => f.favorite);
    } else if (filter === 'recent') {
      displayFoods.sort((a,b)=> new Date(b.dateAdded) - new Date(a.dateAdded));
      displayFoods = displayFoods.slice(0, 10);
    } else if (filter === 'most') {
      displayFoods.sort((a,b)=> getEatCount(b.id) - getEatCount(a.id));
    }
    if (filter === 'all' || filter === 'fav') {
      displayFoods.sort((a,b)=> new Date(b.dateAdded) - new Date(a.dateAdded));
    }
    foodCountSpan.innerText = displayFoods.length;
    if (displayFoods.length === 0) {
      foodListDiv.innerHTML = '<div class="empty-state"><span class="big-icon">🍽️</span>还没有美食，点击右下角 ➕ 添加</div>';
      return;
    }
    foodListDiv.innerHTML = displayFoods.map(food => {
      const ec = getEatCount(food.id);
      const cat = food.category || '其他';
      return `
        <div class="food-item" data-id="${food.id}">
          <div class="food-info">
            <div class="food-name-row">
              <span class="food-name-text">${escapeHtml(food.name)}</span>
              <span class="food-cat-tag cat-${cat}">${cat}</span>
            </div>
            <div class="food-date-text">添加于 ${food.dateAdded}</div>
            <div class="food-stats">🍴 吃过 ${ec} 次</div>
          </div>
          <div class="food-actions">
            <button class="fav-toggle" data-id="${food.id}" title="收藏">${food.favorite ? '❤️' : '🤍'}</button>
            <button class="edit-food" data-id="${food.id}" title="编辑">✏️</button>
            <button class="delete-food" data-id="${food.id}" title="删除">🗑️</button>
          </div>
        </div>`;
    }).join('');
    attachListEvents();
  }

  function attachListEvents() {
    document.querySelectorAll('.fav-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const f = foods.find(fi => fi.id === id);
        if (f) { f.favorite = !f.favorite; saveAll(); renderFoodList(); playSound('click'); }
      });
    });
    document.querySelectorAll('.edit-food').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const f = foods.find(fi => fi.id === id);
        if (f) openEditModal(f);
      });
    });
    document.querySelectorAll('.delete-food').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const f = foods.find(fi => fi.id === id);
        if (f) openDeleteModal(f);
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ==================== 数据操作 ====================
  function addFood(name, category) {
    const newId = Date.now().toString() + Math.random().toString(36).substr(2, 5);
    const today = new Date().toISOString().slice(0, 10);
    foods.push({ id: newId, name: name.trim(), category: category || '其他', favorite: false, dateAdded: today });
    saveAll(); renderFoodList(); playSound('add');
  }

  function editFood(id, newName, newCategory) {
    const food = foods.find(f => f.id === id);
    if (food) {
      food.name = newName.trim();
      food.category = newCategory || '其他';
      saveAll(); renderFoodList(); playSound('click');
    }
  }

  function deleteFood(id) {
    foods = foods.filter(f => f.id !== id);
    eatHistory = eatHistory.filter(h => h.foodId !== id);
    saveAll(); renderFoodList();
    if (currentFood && currentFood.id === id) resetCard();
    playSound('delete');
  }

  function recordEat(foodId) {
    const today = new Date().toISOString().slice(0, 10);
    eatHistory.push({ foodId, date: today });
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 90);
    eatHistory = eatHistory.filter(h => new Date(h.date) >= cutoff);
    saveAll();
  }

  // ==================== 弹窗 ====================
  function openAddModal() {
    modalTitle.innerText = '➕ 新美食';
    foodNameInput.value = '';
    charCountSpan.innerText = '0';
    categorySelect.value = '中餐';
    editTargetId = null;
    modalConfirm.innerText = '添加';
    modalConfirm.onclick = () => {
      const name = foodNameInput.value.trim();
      if (!name) { alert('请输入菜名'); return; }
      if (name.length > 15) { alert('菜名不能超过15字'); return; }
      addFood(name, categorySelect.value);
      modal.classList.remove('open');
    };
    modal.classList.add('open');
    foodNameInput.focus();
  }

  function openEditModal(food) {
    modalTitle.innerText = '✏️ 编辑美食';
    foodNameInput.value = food.name;
    charCountSpan.innerText = food.name.length;
    categorySelect.value = food.category || '其他';
    editTargetId = food.id;
    modalConfirm.innerText = '保存';
    modalConfirm.onclick = () => {
      const newName = foodNameInput.value.trim();
      if (!newName) { alert('菜名不能为空'); return; }
      if (newName.length > 15) { alert('菜名不能超过15字'); return; }
      editFood(editTargetId, newName, categorySelect.value);
      modal.classList.remove('open');
    };
    modal.classList.add('open');
    foodNameInput.focus();
  }

  function openDeleteModal(food) {
    deleteFoodNameSpan.innerText = `确定删除 "${food.name}" 吗？`;
    deleteConfirm.onclick = () => { deleteFood(food.id); deleteModal.classList.remove('open'); };
    deleteModal.classList.add('open');
  }

  // ==================== 随机算法 ====================
  function getCandidateFoods() {
    let candidates = [...foods];
    if (currentCategory !== 'all') {
      candidates = candidates.filter(f => f.category === currentCategory);
    }
    return candidates;
  }

  function getRandomFoodByMode() {
    let candidates = getCandidateFoods();
    if (candidates.length === 0) return null;

    if (currentMode === 'avoid') {
      const recentIds = getRecentEatenIds(3);
      let weighted = [];
      for (let f of candidates) {
        let weight = recentIds.includes(f.id) ? 0.15 : 1;
        for (let i = 0; i < Math.ceil(weight * 8); i++) weighted.push(f);
      }
      if (weighted.length) candidates = weighted;
    } else if (currentMode === 'favor') {
      let favWeighted = [];
      for (let f of candidates) {
        let repeat = f.favorite ? 5 : 1;
        for (let i = 0; i < repeat; i++) favWeighted.push(f);
      }
      if (favWeighted.length) candidates = favWeighted;
    } else if (currentMode === 'adventure') {
      const eatenIds = new Set(eatHistory.map(h => h.foodId));
      const newOnes = candidates.filter(f => !eatenIds.has(f.id));
      if (newOnes.length > 0) candidates = newOnes;
      else alert('👏 你尝遍了所有美食！要不要加点新菜？');
    }

    if (candidates.length === 0) candidates = getCandidateFoods();
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  // ==================== 老虎机动画 ====================
  function startSlotAnimation(callback) {
    if (!slotEnabled) { callback(); return; }
    isSpinning = true;
    const candidates = getCandidateFoods();
    if (candidates.length === 0) { callback(); return; }

    const innerCard = document.querySelector('.card-inner');
    const slotDiv = document.createElement('div');
    slotDiv.className = 'slot-container';
    slotDiv.id = 'slotOverlay';
    const slotItem = document.createElement('div');
    slotItem.className = 'slot-item';
    slotDiv.appendChild(slotItem);
    innerCard.appendChild(slotDiv);

    let ticks = 0;
    const maxTicks = 22;
    const interval = setInterval(() => {
      slotItem.innerText = candidates[Math.floor(Math.random() * candidates.length)].name;
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(interval);
        slotDiv.classList.add('slot-hidden');
        setTimeout(() => slotDiv.remove(), 100);
        isSpinning = false;
        callback();
      }
    }, 70 + Math.random() * 20);

    playSound('spin');
  }

  // ==================== 卡片翻转 ====================
  function showFoodOnCard(food) {
    currentFood = food;
    document.getElementById('foodName').innerText = food.name;

    const cat = food.category || '其他';
    const catEl = document.getElementById('foodCategory');
    catEl.innerText = cat;
    catEl.className = 'food-category cat-' + cat;

    document.getElementById('foodFav').innerHTML = food.favorite ? '❤️ 已收藏' : '🤍 未收藏';
    document.getElementById('foodDate').innerText = `添加于 ${food.dateAdded}`;
    document.getElementById('foodEatCount').innerText = `已吃 ${getEatCount(food.id)} 次`;
    const modeMsg = {
      fair: '🎲 纯随机',
      avoid: '⚡ 避开了最近吃过的',
      favor: '❤️ 你的收藏宝贝',
      adventure: '🌶️ 尝个鲜吧'
    };
    document.getElementById('modeHint').innerText = modeMsg[currentMode] || '';

    const innerCard = document.querySelector('.card-inner');
    if (innerCard) {
      innerCard.classList.add('flipped');
    }

    ateBtn.disabled = false;
    ateBtn.classList.remove('disabled');

    const cardRect = decisionCard.getBoundingClientRect();
    spawnParticles(cardRect.left + cardRect.width / 2, cardRect.top + cardRect.height / 2);

    playSound('win');
    vibrate(80);
  }

  function resetCard() {
    const innerCard = document.querySelector('.card-inner');
    if (innerCard) innerCard.classList.remove('flipped');
    ateBtn.disabled = true;
    ateBtn.classList.add('disabled');
    currentFood = null;
  }

  function randomPick() {
    if (isSpinning) return;
    const candidates = getCandidateFoods();
    if (candidates.length === 0) {
      const catMsg = currentCategory !== 'all' ? `"${currentCategory}"分类下暂无美食` : '请先添加美食';
      alert(catMsg);
      return;
    }

    // 如果之前有结果，先翻转回来再重新转
    const innerCard = document.querySelector('.card-inner');
    if (innerCard && innerCard.classList.contains('flipped')) {
      innerCard.classList.remove('flipped');
      setTimeout(() => {
        startSlotAnimation(() => {
          const food = getRandomFoodByMode();
          if (food) showFoodOnCard(food);
        });
      }, 350);
    } else {
      startSlotAnimation(() => {
        const food = getRandomFoodByMode();
        if (food) showFoodOnCard(food);
      });
    }
  }

  function confirmAte() {
    if (!currentFood) return;
    recordEat(currentFood.id);
    playSound('chew');
    vibrate(50);

    const innerCard = document.querySelector('.card-inner');
    if (innerCard) {
      const checkMark = document.createElement('div');
      checkMark.innerText = '✅';
      checkMark.style.cssText = 'position:absolute;font-size:56px;top:38%;left:38%;opacity:1;transition:opacity 0.5s;pointer-events:none;z-index:20;';
      innerCard.appendChild(checkMark);
      setTimeout(() => { checkMark.style.opacity = '0'; setTimeout(() => checkMark.remove(), 500); }, 200);
    }

    renderFoodList();
    setTimeout(() => resetCard(), 700);
  }

  // ==================== 摇一摇 ====================
  let lastShake = 0;
  function initShake() {
    if (window.DeviceMotionEvent) {
      window.addEventListener('devicemotion', (e) => {
        let acc = e.accelerationIncludingGravity;
        if (!acc) return;
        let shake = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
        let now = Date.now();
        if (shake > 25 && now - lastShake > 1000) {
          lastShake = now;
          // 摇一摇始终触发随机，不管卡片状态
          randomPick();
          vibrate(100);
        }
      });
    }
  }

  // ==================== 导入导出 ====================
  function exportData() {
    const dataStr = JSON.stringify({
      version: '2.0',
      exportDate: new Date().toISOString(),
      foods,
      eatHistory
    }, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `my_foods_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    playSound('click');
  }

  function importData(mode) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const json = JSON.parse(ev.target.result);
          let importedFoods = json.foods;
          let importedHistory = json.eatHistory || [];
          if (!Array.isArray(importedFoods)) throw new Error('格式错误');

          if (mode === 'overwrite') {
            foods = importedFoods;
            eatHistory = importedHistory;
          } else if (mode === 'merge') {
            const existingIds = new Set(foods.map(f => f.id));
            for (let f of importedFoods) {
              if (!existingIds.has(f.id)) {
                foods.push(f);
                existingIds.add(f.id);
              } else {
                const idx = foods.findIndex(fi => fi.id === f.id);
                if (idx !== -1) foods[idx] = f;
              }
            }
            const histIds = new Set(eatHistory.map(h => h.foodId + h.date));
            for (let h of importedHistory) {
              if (!histIds.has(h.foodId + h.date)) {
                eatHistory.push(h);
                histIds.add(h.foodId + h.date);
              }
            }
          }
          saveAll();
          renderFoodList();
          alert('✅ 导入成功！');
          playSound('add');
        } catch (err) {
          alert('❌ 文件格式错误，请检查');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function importTemplate(tplName) {
    const tpl = templates[tplName];
    if (!tpl) return;
    const count = tpl.length;
    const existingNames = new Set(foods.map(f => f.name));
    let added = 0;
    for (let item of tpl) {
      if (!existingNames.has(item.name)) {
        const newId = Date.now().toString() + Math.random().toString(36).substr(2, 5);
        foods.push({
          id: newId, name: item.name, category: item.category,
          favorite: false, dateAdded: new Date().toISOString().slice(0, 10)
        });
        existingNames.add(item.name);
        added++;
      }
    }
    saveAll();
    renderFoodList();
    alert(`✅ 已导入 ${added} 道新美食（跳过了 ${count - added} 道重复的）`);
    playSound('add');
  }

  // ==================== 统计面板 ====================
  function showStats() {
    const total = foods.length;
    const favCount = foods.filter(f => f.favorite).length;
    const totalEats = eatHistory.length;
    const eatenIds = new Set(eatHistory.map(h => h.foodId));
    const newCount = foods.filter(f => !eatenIds.has(f.id)).length;

    document.getElementById('statTotal').innerText = total;
    document.getElementById('statFav').innerText = favCount;
    document.getElementById('statEats').innerText = totalEats;
    document.getElementById('statNew').innerText = newCount;

    const ranked = foods.map(f => ({ name: f.name, count: getEatCount(f.id), fav: f.favorite }))
      .sort((a, b) => b.count - a.count)
      .slice(0, 5);

    const topRankDiv = document.getElementById('topRank');
    if (ranked.length === 0 || ranked[0].count === 0) {
      topRankDiv.innerHTML = '<p style="color:var(--text-secondary);text-align:center;">还没有吃过任何美食哦~</p>';
    } else {
      topRankDiv.innerHTML = ranked.map((r, i) => `
        <div class="rank-item">
          <span class="rank-num">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`}</span>
          <span class="rank-name">${escapeHtml(r.name)} ${r.fav ? '❤️' : ''}</span>
          <span class="rank-count">${r.count}次</span>
        </div>
        <div class="stat-bar" style="width:${Math.max(r.count / Math.max(ranked[0].count, 1) * 100, 10)}%"></div>
      `).join('');
    }

    const weekCal = document.getElementById('weekCalendar');
    const weekDetail = document.getElementById('weekDetail');
    const days = ['日', '一', '二', '三', '四', '五', '六'];
    let html = '';
    let dayDetails = [];

    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().slice(0, 10);
      const dayEats = eatHistory.filter(h => h.date === dateStr);
      const eaten = dayEats.length > 0;
      const dayName = i === 0 ? '今天' : i === 1 ? '昨天' : days[d.getDay()];

      html += `<div class="day-dot ${eaten ? 'eaten' : 'not-eaten'}" title="${dateStr}">${dayName}</div>`;

      if (eaten) {
        const names = dayEats.map(h => {
          const f = foods.find(fi => fi.id === h.foodId);
          return f ? f.name : '未知';
        }).join(', ');
        dayDetails.push(`${dayName}: ${names}`);
      }
    }
    weekCal.innerHTML = html;
    weekDetail.innerText = dayDetails.length > 0 ? '📝 ' + dayDetails.join(' | ') : '近7天暂无记录';

    statsPanel.classList.add('open');
  }

    document.body.addEventListener('click', (e) => {
      if (!soundEnabled && (e.target.closest('.mode-btn') || e.target.closest('.fab') ||
          e.target.closest('.ate-btn') || e.target.closest('.decision-card'))) {
        enableSound();
      }
    }, { once: true });

    // 输入框字数统计
    foodNameInput.addEventListener('input', () => {
      charCountSpan.innerText = foodNameInput.value.length;
    });

    // 点击弹窗外部关闭
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
    deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) deleteModal.classList.remove('open'); });
    importModal.addEventListener('click', (e) => { if (e.target === importModal) importModal.classList.remove('open'); });
    templateModal.addEventListener('click', (e) => { if (e.target === templateModal) templateModal.classList.remove('open'); });

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        modal.classList.remove('open');
        deleteModal.classList.remove('open');
        importModal.classList.remove('open');
        templateModal.classList.remove('open');
        settingsPanel.classList.remove('open');
        statsPanel.classList.remove('open');
      }
      if (e.key === ' ' && !document.querySelector('.modal.open') && !document.querySelector('.settings-panel.open')) {
        e.preventDefault();
        randomPick();
      }
    });
  }

  init();
})();
</script>
</body>
</html>
